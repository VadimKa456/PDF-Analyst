name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (Python 3.12, pytest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ..\requirements.txt
      - name: Generate deterministic PDF test corpus
        run: python ..\samples\generate_samples.py
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  ocr-regression:
    name: OCR regression (Tesseract Russian + English)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tesseract with Russian language data
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Generate deterministic OCR test corpus
        run: python samples/generate_samples.py
      - name: Run OCR regression tests
        working-directory: backend
        run: python -m pytest -q tests/test_ocr.py

  pdf-engine-benchmark:
    name: PDF engine benchmark (non-gating)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-pdf-engine-spike.txt
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-pdf-engine-spike.txt
      - name: Run bounded synthetic benchmark
        run: python scripts/benchmark_pdf_engines.py --pages 200 --repeats 3 --output benchmark-results.json
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-engine-benchmark
          path: benchmark-results.json
          if-no-files-found: ignore

  pdfium-comparison:
    name: PDFium vs PyMuPDF corpus comparison
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-pdf-engine-spike.txt
      - name: Install baseline and experimental PDF engines
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-pdf-engine-spike.txt
      - name: Generate deterministic PDF comparison corpus
        run: python samples/generate_samples.py
      - name: Run PDFium smoke and baseline comparison tests
        working-directory: backend
        run: python -m pytest -q tests/test_pdfium_spike.py tests/test_pdfium_corpus.py
