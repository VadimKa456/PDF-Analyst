name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (Python 3.12, pytest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ..\requirements.txt
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  pdfium-comparison:
    name: PDFium vs PyMuPDF corpus comparison
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-pdf-engine-spike.txt
      - name: Install baseline and experimental PDF engines
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-pdf-engine-spike.txt
      - name: Generate deterministic PDF comparison corpus
        run: python samples/generate_samples.py
      - name: Run PDFium smoke and baseline comparison tests
        working-directory: backend
        run: python -m pytest -q tests/test_pdfium_spike.py tests/test_pdfium_corpus.py
